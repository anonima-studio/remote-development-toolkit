name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test (macOS client)
    # The operator client is macOS; scripts must keep working with its Bash 3.2.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm from packageManager
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test < /dev/null

  workspace-image:
    name: Build workspace image and validate Coder Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Check workspace image pins
        run: python3 -B bin/remote-dev-image-hash.py --check

      - name: Validate Coder Compose with a sample environment
        run: |
          sample_env=$(mktemp)
          trap 'rm -f "$sample_env"' EXIT
          cat > "$sample_env" <<'ENV'
          CODER_HOST_PORT=3080
          CODER_ACCESS_URL=http://127.0.0.1:3080
          REMOTE_DEV_EGRESS_MTU=1500
          DOCKER_GID=999
          POSTGRES_USER=coder
          POSTGRES_PASSWORD=ci-placeholder-not-a-secret
          POSTGRES_DB=coder
          ENV
          docker compose --env-file "$sample_env" -f deploy/coder/compose.yaml config --quiet

      - name: Build workspace image (no push)
        run: |
          source_hash=$(sed -n 's/^workspace_image_expected_hash=//p' deploy/install.sh)
          docker build --build-arg REMOTE_DEV_WORKSPACE_SOURCE_SHA256="$source_hash" templates/docker

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        # The MIT-licensed CLI image needs no license key, unlike the action.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1
